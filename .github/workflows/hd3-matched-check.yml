name: hd3-matched-check

on:
  pull_request:
    paths:
      - ".github/workflows/hd3-matched-check.yml"
      - "configs/hd3_matched_american_put_comparison.json"
      - "experiments/hd3_matched_american_put_comparison.py"
      - "tests/test_hd3_matched_american_put_comparison.py"
      - "scripts/run_hd3_matched_american_put_windows.ps1"
      - "scripts/check_hd3_matched_american_put_status.ps1"
      - "scripts/push_hd3_matched_results_windows.ps1"
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip
      - run: python -m pip install -r requirements.txt
      - name: Focused matched-contract tests
        run: python -m pytest tests/test_hd3_matched_american_put_comparison.py -q
      - name: Python compile check
        run: >-
          python -m compileall -q
          experiments/hd3_matched_american_put_comparison.py
          tests/test_hd3_matched_american_put_comparison.py
      - name: CPU-safe status CLI smoke
        run: python experiments/hd3_matched_american_put_comparison.py --phase status
      - name: PowerShell parser checks
        shell: pwsh
        run: |
          $paths = @(
            "scripts/run_hd3_matched_american_put_windows.ps1",
            "scripts/check_hd3_matched_american_put_status.ps1",
            "scripts/push_hd3_matched_results_windows.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
