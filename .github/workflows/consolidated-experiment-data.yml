name: Consolidated experiment data

on:
  push:
    branches:
      - data/consolidated-experiment-csv
  pull_request:
    branches:
      - campaign/independent-methods
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install consolidation dependencies
        run: python -m pip install --disable-pip-version-check numpy

      - name: Run consolidated-data contract tests
        run: python -m unittest tests/test_consolidated_experiment_data.py -v
