name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src:experiments
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -U pip
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Regenerate ignored report artifacts
        run: |
          PY=python bash scripts/bootstrap_artifacts.sh
          git checkout -- results
      - run: python -m pytest tests -q
      - run: python -m compileall -q src tests experiments analysis

  dirk-crr50k-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned companion solver source
        uses: actions/checkout@v4
        with:
          repository: Ruixixu-hub/2026-surf-american-risk-surfaces
          ref: 5f63fa7b12f704c3577c72f9d7b7e5146e78c1ca
          path: _vendor/ruixi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 scipy==1.16.0 pytest
      - name: DIRK vs CRR50k convergence contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/_vendor/ruixi/src:${{ github.workspace }}
        run: python -m pytest -q tests/test_dirk_binomial_50k_convergence.py
