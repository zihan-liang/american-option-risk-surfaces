name: Render revised Fig01 tau05

on:
  pull_request:
    branches:
      - data/consolidated-experiment-csv
    paths:
      - "analysis/final_matched_comparison/plot_fig01_tau05_from_consolidated.py"
      - "analysis/final_matched_comparison/render_fig01_tau05_svg.py"
      - "analysis/final_matched_comparison/fig01_render_trigger.txt"
      - ".github/workflows/render-fig01-tau05.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Render dependency-free Fig01 SVG
        run: python3 analysis/final_matched_comparison/render_fig01_tau05_svg.py

      - name: Verify rendered SVG
        run: |
          test -s figures/final_matched_comparison/poster/fig01_price_slice_tau05.svg
          test -s figures/final_matched_comparison/poster/fig01_render.log
          grep -q 'Price Slice at τ/T=0.5' figures/final_matched_comparison/poster/fig01_price_slice_tau05.svg
          grep -q 'points=' figures/final_matched_comparison/poster/fig01_render.log
          wc -c figures/final_matched_comparison/poster/fig01_price_slice_tau05.svg
          cat figures/final_matched_comparison/poster/fig01_render.log

      - name: Commit rendered SVG to PR branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- \
            figures/final_matched_comparison/poster/fig01_price_slice_tau05.svg \
            figures/final_matched_comparison/poster/fig01_render.log
          if git diff --cached --quiet; then
            echo "Rendered files unchanged."
          else
            git commit -m "figures: render revised Fig01 tau05"
            git push origin HEAD:"$HEAD_REF"
          fi
