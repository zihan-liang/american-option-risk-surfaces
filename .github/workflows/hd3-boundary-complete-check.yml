name: hd3-boundary-complete-check

on:
  push:
    branches:
      - exp/hd3-matched-american-put-final-boundary-complete
  pull_request:
    paths:
      - 'configs/hd3_matched_american_put_boundary_complete.json'
      - 'experiments/hd3_matched_boundary_complete_core.py'
      - 'experiments/hd3_matched_american_put_boundary_complete.py'
      - 'experiments/hd3_matched_boundary_complete_windows_entrypoint.py'
      - 'scripts/run_hd3_matched_boundary_complete_windows.ps1'
      - 'scripts/check_hd3_matched_boundary_complete_status.ps1'
      - 'tests/test_hd3_matched_boundary_complete.py'
      - 'tests/test_hd3_matched_boundary_complete_invariants.py'
      - '.github/workflows/hd3-boundary-complete-check.yml'

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -U pip
      - run: python -m pip install -r requirements.txt
      - name: Focused boundary-complete tests
        run: |
          python -m pytest \
            tests/test_hd3_matched_boundary_complete.py \
            tests/test_hd3_matched_boundary_complete_invariants.py \
            -q
      - name: Python compile check
        run: |
          python -m compileall -q \
            experiments/hd3_matched_boundary_complete_core.py \
            experiments/hd3_matched_american_put_boundary_complete.py \
            experiments/hd3_matched_boundary_complete_windows_entrypoint.py \
            tests/test_hd3_matched_boundary_complete.py \
            tests/test_hd3_matched_boundary_complete_invariants.py
      - name: Boundary-complete oracle preflight integration
        run: python experiments/hd3_matched_boundary_complete_windows_entrypoint.py --phase preflight
      - name: CPU-safe status CLI smoke
        run: python experiments/hd3_matched_boundary_complete_windows_entrypoint.py --phase status
      - name: PowerShell parser checks
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content scripts/run_hd3_matched_boundary_complete_windows.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content scripts/check_hd3_matched_boundary_complete_status.ps1 -Raw))
