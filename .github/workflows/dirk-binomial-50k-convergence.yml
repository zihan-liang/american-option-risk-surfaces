name: DIRK CRR50k convergence audit

on:
  push:
    branches:
      - exp/dirk-binomial-50k-convergence-audit
    paths:
      - 'experiments/reference_audits/**'
      - 'tests/test_dirk_binomial_50k_convergence.py'
      - '.github/workflows/dirk-binomial-50k-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Checkout frozen Ruixi solver source
        uses: actions/checkout@v4
        with:
          repository: Ruixixu-hub/2026-surf-american-risk-surfaces
          ref: 5f63fa7b12f704c3577c72f9d7b7e5146e78c1ca
          path: _vendor/ruixi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 scipy==1.16.0 pytest

      - name: Verify frozen Ruixi checkout
        run: |
          test "$(git -C _vendor/ruixi rev-parse HEAD)" = "5f63fa7b12f704c3577c72f9d7b7e5146e78c1ca"

      - name: Harness startup verification
        env:
          PY: python
          MPLBACKEND: Agg
          MPLCONFIGDIR: /tmp/mplconfig
        run: bash scripts/init_harness.sh

      - name: Focused convergence contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/_vendor/ruixi/src:${{ github.workspace }}
        run: python -m pytest -q tests/test_dirk_binomial_50k_convergence.py
