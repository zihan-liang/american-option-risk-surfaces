name: DIRK CRR50k convergence audit

on:
  push:
    branches:
      - exp/dirk-binomial-50k-convergence-audit
    paths:
      - 'experiments/reference_audits/**'
      - 'tests/test_dirk_binomial_50k_convergence.py'
      - '.github/workflows/dirk-binomial-50k-convergence.yml'
  pull_request:
    branches:
      - data/consolidated-experiment-csv
    paths:
      - 'experiments/reference_audits/**'
      - 'tests/test_dirk_binomial_50k_convergence.py'
      - '.github/workflows/dirk-binomial-50k-convergence.yml'
  workflow_dispatch:

concurrency:
  group: dirk-crr50k-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Checkout frozen Ruixi solver source
        uses: actions/checkout@v4
        with:
          repository: Ruixixu-hub/2026-surf-american-risk-surfaces
          ref: 5f63fa7b12f704c3577c72f9d7b7e5146e78c1ca
          path: _vendor/ruixi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 scipy==1.16.0 pytest

      - name: Verify frozen Ruixi checkout
        run: |
          test "$(git -C _vendor/ruixi rev-parse HEAD)" = "5f63fa7b12f704c3577c72f9d7b7e5146e78c1ca"

      - name: Harness startup verification
        env:
          PY: python
          MPLBACKEND: Agg
          MPLCONFIGDIR: /tmp/mplconfig
        run: bash scripts/init_harness.sh

      - name: Focused convergence contracts with persistent evidence
        env:
          PYTHONPATH: ${{ github.workspace }}/_vendor/ruixi/src:${{ github.workspace }}
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_dirk_binomial_50k_convergence.py 2>&1 | tee /tmp/dirk_crr50k_contract.log
          status=${PIPESTATUS[0]}
          set -e

          mkdir -p results/dirk_binomial_50k_convergence
          {
            echo "event=${GITHUB_EVENT_NAME}"
            echo "workflow_sha=${GITHUB_SHA}"
            echo "ruixi_source_commit=$(git -C _vendor/ruixi rev-parse HEAD)"
            echo "pytest_exit_code=${status}"
            echo "--- pytest tail ---"
            tail -n 80 /tmp/dirk_crr50k_contract.log
          } > results/dirk_binomial_50k_convergence/ci_contract_status.txt

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add results/dirk_binomial_50k_convergence/ci_contract_status.txt
            if ! git diff --cached --quiet; then
              git commit -m "ci: record DIRK CRR50k contract status [skip ci]"
              git push origin HEAD:${GITHUB_REF_NAME}
            fi
          fi

          exit "${status}"
