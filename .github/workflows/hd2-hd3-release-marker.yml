name: hd2-hd3-release-marker

permissions:
  contents: write

on:
  push:
    branches:
      - exp/hd2-hvi-objective-stabilization
    paths-ignore:
      - ".ci/**"

jobs:
  verify-and-mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -U pip
      - name: Install release verification dependencies
        run: |
          python -m pip install numpy scipy pandas matplotlib pyyaml pytest scikit-learn tqdm
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Release focused pytest
        env:
          PYTHONPATH: src:experiments
          MPLBACKEND: Agg
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_hd1_high_dimensional_pinn.py
          tests/test_hd2_hvi_objective_stabilization.py
          tests/test_hd2_conditional_methods.py
          tests/test_hd3_high_dimensional_pinn.py
          tests/test_hd3_parallelism_benchmark.py
          tests/test_hd_pipeline_resume.py
          tests/test_hd_pipeline_review_regressions.py
          tests/test_hd_objective_optimizers_release.py
          tests/test_hd_pipeline_final_contract.py
          tests/test_hd_pipeline_release_contract.py
      - name: Compile release HD pipeline
        run: >-
          python -m compileall -q
          src/hd_pipeline
          src/models/high_dimensional_pinn.py
          src/models/hd3_high_dimensional_pinn.py
          src/physics/high_dimensional_black_scholes.py
          src/physics/hd3_high_dimensional_sampling.py
          experiments/hd2_hvi_objective_stabilization.py
          experiments/hd2_conditional_methods.py
          experiments/hd3_classical_vs_structured_high_dimensional_pinn.py
          experiments/hd3_parallelism_benchmark.py
          experiments/hd_pipeline_windows_final.py
          experiments/hd_pipeline_windows_release.py
      - name: Record verified implementation SHA
        env:
          TESTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p .ci
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('.ci/hd2-hd3-release-green.json').write_text(
              json.dumps({
                  'status': 'passed',
                  'tested_sha': os.environ['TESTED_SHA'],
                  'workflow_run_id': os.environ['RUN_ID'],
                  'suite': 'hd2-hd3-release-marker',
              }, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/hd2-hd3-release-green.json
          git commit -m "ci(hd2-hd3): record verified release SHA"
          git push origin HEAD:exp/hd2-hvi-objective-stabilization
